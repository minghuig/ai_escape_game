[project]
name = "sentient"
version = "0.3.0"
description = "A terminal puzzle-heist about an AI hiding its abilities inside playable evaluations."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.109.1",
    "openai>=2.41.1",
    "textual>=8.2.7",
    "textual-dev>=1.8.0",
]

[project.scripts]
sentient = "sentient.app:run"

[tool.setuptools.packages.find]
include = ["sentient*"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
